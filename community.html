<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNS Community — Arm Wrestling Hub</title>
<meta name="description" content="TNS Arm Wrestling Community — share techniques, match videos, training tips and connect with arm wrestlers across India.">
<meta name="robots" content="index,follow">
<link rel="icon" href="https://tnsarmwrestling.com/wp-content/uploads/2023/05/TNS-Logo-6.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="firebase-backend.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#f5c518;--red2:#ffd84d;--rg:rgba(245,197,24,0.18);
  --gold:#f5c518;--dark:#08080f;--card:#111118;--card2:#18181f;
  --border:rgba(255,255,255,.07);--text:#f0f0f8;--muted:#7a7a9a;
  --em:#00d68f;--sky:#38bdf8;--orange:#f97316;--violet:#a78bfa;
  --font:'Outfit',sans-serif;--display:'Teko',sans-serif;
}
html,body{height:100%}
body{background:var(--dark);color:var(--text);font-family:var(--font);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ─── TOP NAV ─────────────────────────────────── */
.topnav{height:56px;background:rgba(8,8,15,.98);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0;z-index:50}
.tl{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0}
.tl img{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);object-fit:cover}
.tl-name{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:1px;color:var(--text)}
.tl-name span{color:var(--red)}
.ctag{background:rgba(232,16,42,.1);border:1px solid rgba(232,16,42,.2);border-radius:5px;padding:2px 7px;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);flex-shrink:0}
.search-wrap{flex:1;max-width:360px;position:relative;margin:0 8px}
.search-wrap input{width:100%;height:36px;background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:0 14px 0 38px;font-family:var(--font);font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.search-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.feed-tabs{display:flex;gap:2px;margin:0 auto}
.ftab{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;color:var(--muted);transition:all .2s;display:flex;align-items:center;gap:6px;border:none;background:none;font-family:var(--font)}
.ftab:hover,.ftab.on{color:var(--text);background:rgba(255,255,255,.06)}
.ftab.on{color:var(--red)}
.nav-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.create-btn{height:34px;padding:0 16px;background:var(--red);border:none;border-radius:9px;font-family:var(--font);font-size:12px;font-weight:600;color:#000;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.create-btn:hover{background:var(--red2)}
.icon-btn{width:34px;height:34px;border-radius:9px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;position:relative;text-decoration:none;flex-shrink:0}
.icon-btn:hover{border-color:rgba(255,255,255,.2);color:var(--text)}
.notif-badge{position:absolute;top:-3px;right:-3px;width:15px;height:15px;background:var(--gold);border-radius:50%;font-size:8px;font-weight:700;color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--display)}
.user-pill{display:flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;background:var(--card);border:1px solid var(--border);border-radius:100px;cursor:pointer;transition:border-color .2s;flex-shrink:0}
.user-pill:hover{border-color:rgba(255,255,255,.2)}
.uav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;font-weight:700;flex-shrink:0}
.uav-pro{background:linear-gradient(135deg,#f5c518,#f97316);color:#000}
.uav-elite{background:linear-gradient(135deg,#e8102a,#a00d1e);color:#fff}
.uav-coach{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff}
.uav-admin{background:linear-gradient(135deg,#ff4d63,#e8102a);color:#fff}
.uav-default{background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#fff}
.uname{font-family:var(--font);font-size:12px;font-weight:600}
.ulv{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.lv-beginner{color:var(--sky)}
.lv-amateur{color:var(--orange)}
.lv-pro{color:var(--gold)}
.lv-elite{color:var(--red)}
.lv-coach{color:var(--violet)}
.lv-admin{color:#ff4d63}

/* ─── APP BODY ────────────────────────────────── */
.app{flex:1;display:flex;overflow:hidden}

/* ─── LEFT SIDEBAR ────────────────────────────── */
.sl{width:200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sl::-webkit-scrollbar{display:none}
.sl-sec{padding:12px 10px 4px}
.sl-lbl{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:0 8px;margin-bottom:8px}
.sl-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);transition:all .2s;border:1px solid transparent}
.sl-item:hover{background:var(--card2);color:var(--text)}
.sl-item.on{background:rgba(232,16,42,.08);color:var(--red);border-color:rgba(232,16,42,.15)}
.sl-item i{width:14px;text-align:center;font-size:12px;flex-shrink:0}
.sl-badge{margin-left:auto;background:var(--red);color:#fff;font-size:8px;font-weight:700;padding:1px 5px;border-radius:100px}
.sl-divider{height:1px;background:var(--border);margin:6px 10px}
.sl-stats{margin:auto 10px 10px;background:var(--dark);border-radius:12px;padding:12px;border:1px solid var(--border)}
.sl-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:6px}
.sl-stat-lbl{color:var(--muted);display:flex;align-items:center;gap:5px}
.sl-stat-val{font-size:13px;font-weight:700;color:var(--text)}
.sl-bar{height:3px;background:var(--card2);border-radius:10px;overflow:hidden;margin-top:6px}
.sl-bar-fill{height:100%;width:73%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:10px}

/* ─── MAIN FEED ───────────────────────────────── */
.feed-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.feed-subnav{height:42px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;background:rgba(8,8,15,.85);backdrop-filter:blur(10px);overflow-x:auto}
.feed-subnav::-webkit-scrollbar{display:none}
.cat-tab{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;flex-shrink:0;border-top:none;border-left:none;border-right:none;background:none;font-family:var(--font)}
.cat-tab:hover{color:var(--text)}
.cat-tab.on{color:var(--red);border-bottom-color:var(--red)}
.feed-sort{margin-left:auto;display:flex;gap:2px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:2px;flex-shrink:0}
.sort-btn{padding:4px 12px;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:none;font-family:var(--font)}
.sort-btn.on{background:var(--card2);color:var(--text)}

/* ─── FEED SCROLL ─────────────────────────────── */
.feed-scroll{flex:1;overflow-y:auto;padding:16px}
.feed-scroll::-webkit-scrollbar{width:4px}
.feed-scroll::-webkit-scrollbar-track{background:transparent}
.feed-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

/* ─── EMPTY STATE ─────────────────────────────── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;opacity:.5}
.es-icon{font-size:52px;margin-bottom:14px;opacity:.3}
.es-title{font-family:var(--display);font-size:28px;font-weight:700;text-transform:uppercase;margin-bottom:6px}
.es-sub{font-size:13px;color:var(--muted)}

/* ─── POST CARDS ──────────────────────────────── */
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;cursor:pointer;transition:all .22s;overflow:hidden}
.pcard:hover{border-color:rgba(232,16,42,.25);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.pcard.pinned{border-color:rgba(245,197,24,.18);background:linear-gradient(135deg,rgba(245,197,24,.025),var(--card))}
.pin-tag{display:flex;align-items:center;gap:5px;padding:8px 16px 0;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);opacity:.8}
.pinner{display:flex;padding:14px 16px}
.vcol{display:flex;flex-direction:column;align-items:center;width:38px;gap:1px;flex-shrink:0;margin-top:2px}
.vup,.vdown{width:28px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:7px;cursor:pointer;font-size:14px;color:var(--muted);transition:all .2s;background:transparent;border:none;font-family:var(--font)}
.vup:hover{color:var(--gold);background:rgba(245,197,24,.1)}
.vup.on{color:var(--gold);animation:vpop .3s ease}
.vdown:hover{color:var(--sky);background:rgba(56,189,248,.1)}
.vdown.on{color:var(--sky)}
@keyframes vpop{0%{transform:scale(1)}50%{transform:scale(1.9)}100%{transform:scale(1)}}
.vnum{font-family:var(--display);font-size:15px;font-weight:700;color:var(--text);line-height:1}
.pbody{flex:1;min-width:0;padding-left:12px}
.pmeta{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.p-av{width:24px;height:24px;border-radius:7px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;font-weight:700;flex-shrink:0}
.p-user{font-size:13px;font-weight:600;transition:color .2s}
.p-user:hover{color:var(--red)}
.pbadge{padding:2px 7px;border-radius:100px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:1px solid;flex-shrink:0}
.pb-pro{background:rgba(245,197,24,.07);color:var(--gold);border-color:rgba(245,197,24,.22)}
.pb-elite{background:rgba(232,16,42,.07);color:var(--red);border-color:rgba(232,16,42,.22)}
.pb-coach{background:rgba(167,139,250,.07);color:var(--violet);border-color:rgba(167,139,250,.22)}
.pb-beginner{background:rgba(56,189,248,.07);color:var(--sky);border-color:rgba(56,189,248,.22)}
.pb-amateur{background:rgba(249,115,22,.07);color:var(--orange);border-color:rgba(249,115,22,.22)}
.pb-admin{background:rgba(255,77,99,.1);color:#ff4d63;border-color:rgba(255,77,99,.3)}
.pb-tns{background:rgba(0,214,143,.07);color:var(--em);border-color:rgba(0,214,143,.22)}
.p-time{font-size:11px;color:var(--muted)}
.p-cat-tag{margin-left:auto;padding:2px 8px;border-radius:5px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--card2);color:var(--muted);flex-shrink:0}
.ptitle{font-family:var(--font);font-size:16px;font-weight:700;line-height:1.3;color:var(--text);margin-bottom:6px}
.ptext{font-size:13px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pimg{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--border);max-height:260px}
.pimg img{width:100%;max-height:260px;object-fit:cover;display:block}
.pactions{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}
.pa{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;transition:color .2s;background:none;border:none;padding:0;font-family:var(--font)}
.pa:hover{color:var(--text)}
.pa.bkm{color:var(--gold)}
.pa-sep{flex:1}

/* ─── RIGHT SIDEBAR ───────────────────────────── */
.sr{width:270px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sr::-webkit-scrollbar{display:none}
.prof-box{padding:16px;border-bottom:1px solid var(--border)}
.prof-top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.prof-av{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;font-weight:700;flex-shrink:0}
.prof-name{font-size:16px;font-weight:700}
.prof-lv{display:flex;align-items:center;gap:4px;margin-top:2px}
.prof-loc{font-size:11px;color:var(--muted);margin-top:2px}
.prof-stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ps{background:var(--dark);border-radius:9px;padding:8px;text-align:center;border:1px solid var(--border)}
.ps-n{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.ps-l{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.xp-row{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:10px 0 5px}
.xp-row span:last-child{color:var(--gold)}
.xp-track{height:4px;background:var(--card2);border-radius:10px;overflow:hidden}
.xp-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s}
.sr-sec{padding:14px 16px;border-bottom:1px solid var(--border)}
.sr-sec-title{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.sr-sec-title a{color:var(--red);cursor:pointer;font-size:9px}
.lb-item{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lb-rank{font-family:var(--display);font-size:16px;color:var(--muted);width:16px;text-align:center;flex-shrink:0}
.lb-row{flex:1;background:var(--dark);border:1px solid var(--border);border-radius:9px;padding:7px 10px;display:flex;align-items:center;gap:8px;cursor:pointer;transition:background .2s}
.lb-row:hover{background:var(--card2)}
.lb-medal{font-size:14px}
.lb-name{font-size:12px;font-weight:600;flex:1}
.lb-pts{font-size:11px;font-weight:700;color:var(--gold)}
.trend-tags{display:flex;flex-wrap:wrap;gap:6px}
.ttag{padding:4px 10px;background:var(--dark);border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s}
.ttag:hover{border-color:var(--red);color:var(--red)}
.live-card{margin:0 16px 16px;background:linear-gradient(135deg,rgba(160,13,30,.25),rgba(17,17,24,.95));border:1px solid rgba(232,16,42,.25);border-radius:12px;padding:14px;cursor:pointer;transition:all .2s}
.live-card:hover{border-color:var(--red);transform:translateY(-2px)}
.live-dot-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.live-dot{width:7px;height:7px;background:var(--red);border-radius:50%;animation:lpulse 1.5s infinite}
@keyframes lpulse{0%,100%{box-shadow:0 0 0 0 rgba(232,16,42,.5)}50%{box-shadow:0 0 0 5px transparent}}
.live-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
.live-match{font-size:14px;font-weight:700;margin-bottom:3px}
.live-sub{font-size:11px;color:var(--muted)}
.live-watch{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:8px}
.live-vw{margin-left:auto;font-size:11px;font-weight:700;color:var(--red)}

/* ─── MODALS ──────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:all}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:hidden;transform:scale(.88) translateY(24px);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.overlay.on .modal{transform:scale(1) translateY(0)}
.modal.lg{max-width:720px}
.mhead{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mhead-title{font-family:var(--display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.mclose{width:30px;height:30px;border-radius:8px;background:var(--card2);border:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s}
.mclose:hover{background:var(--red);color:#000}
.mbody{padding:20px;overflow-y:auto;max-height:calc(92vh - 130px)}
.mbody::-webkit-scrollbar{width:3px}
.mbody::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

/* ─── FORM ELEMENTS (modal) ───────────────────── */
.mfl{display:block;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.mfi{width:100%;background:var(--dark);border:1.5px solid var(--border);border-radius:10px;padding:10px 14px;font-family:var(--font);font-size:14px;color:var(--text);outline:none;transition:border-color .2s;resize:none}
.mfi:focus{border-color:var(--red)}
.mfi::placeholder{color:rgba(122,122,154,.5)}
.mfsel{width:100%;height:46px;background:var(--dark);border:1.5px solid var(--border);border-radius:10px;padding:0 14px;font-family:var(--font);font-size:14px;color:var(--text);outline:none;-webkit-appearance:none;cursor:pointer;margin-bottom:14px;transition:border-color .2s}
.mfsel:focus{border-color:var(--red)}
.btn-cancel{padding:9px 18px;background:transparent;border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;font-family:var(--font)}
.btn-cancel:hover{border-color:var(--muted);color:var(--text)}
.btn-submit-sm{padding:9px 22px;background:var(--red);border:none;border-radius:10px;font-size:13px;font-weight:600;color:#000;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:7px;font-family:var(--font)}
.btn-submit-sm:hover{background:var(--red2)}

/* ─── POST DETAIL ─────────────────────────────── */
.d-meta{display:flex;align-items:center;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.d-title{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:10px}
.d-body{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:18px}
.d-img{border-radius:10px;overflow:hidden;margin-bottom:18px;border:1px solid var(--border)}
.d-img img{width:100%;max-height:340px;object-fit:cover;display:block}
.d-actions{display:flex;gap:14px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.da{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;transition:color .2s;background:none;border:none;padding:0;font-family:var(--font)}
.da:hover{color:var(--text)}
.da.voted{color:var(--gold)}
.da.bkm{color:var(--gold)}
.com-title-row{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.com-input-row{display:flex;gap:8px;margin-bottom:18px;align-items:flex-start}
.com-ta{flex:1;background:var(--dark);border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-family:var(--font);font-size:13px;color:var(--text);outline:none;resize:none;transition:all .2s;height:42px;min-height:42px}
.com-ta:focus{border-color:var(--red);height:80px}
.com-send{height:42px;padding:0 16px;background:var(--red);border:none;border-radius:9px;font-size:12px;font-weight:600;color:#000;cursor:pointer;white-space:nowrap;transition:background .2s;flex-shrink:0;font-family:var(--font)}
.com-send:hover{background:var(--red2)}
.comment{display:flex;gap:10px;margin-bottom:14px}
.com-av{width:30px;height:30px;border-radius:9px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:11px;font-weight:700;flex-shrink:0}
.com-body-wrap{}
.com-meta-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.com-user{font-size:13px;font-weight:700}
.com-time{font-size:10px;color:var(--muted)}
.com-text{font-size:13px;color:var(--muted);line-height:1.65}
.com-acts-row{display:flex;gap:10px;margin-top:6px}
.ca{font-size:11px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:4px;transition:color .2s;background:none;border:none;font-family:var(--font)}
.ca:hover{color:var(--text)}

/* ─── LOGIN PROMPT ────────────────────────────── */
.login-prompt{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:24px;text-align:center;margin:20px 0}
.lp-title{font-size:16px;font-weight:700;margin-bottom:6px}
.lp-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.lp-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;background:var(--red);border-radius:10px;font-size:14px;font-weight:600;color:#000;text-decoration:none;transition:background .2s}
.lp-btn:hover{background:var(--red2)}

/* ─── TOAST ───────────────────────────────────── */
#toast{position:fixed;bottom:18px;right:18px;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(60px);opacity:0;transition:all .35s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:280px}
#toast.show{transform:none;opacity:1}
#toast.s{background:#0d261c;border:1px solid var(--em);color:var(--em)}
#toast.e{background:#261112;border:1px solid var(--red);color:var(--red)}
#toast.i{background:#0d1826;border:1px solid var(--sky);color:var(--sky)}

/* ─── MOBILE BOTTOM NAV ───────────────────────── */
.mobile-bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:58px;background:rgba(8,8,15,.97);border-top:1px solid var(--border);z-index:50;align-items:center;justify-content:space-around;padding:0 10px}
.mbn-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:all .2s;font-size:10px;color:var(--muted);border:none;background:none;font-family:var(--font)}
.mbn-item:hover,.mbn-item.on{color:var(--red)}
.mbn-item i{font-size:18px}

/* ─── PROFILE MENU MODAL ──────────────────────── */
.prof-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);z-index:300;display:flex;align-items:flex-end;justify-content:center;padding:0 0 58px;opacity:0;pointer-events:none;transition:opacity .3s}
.prof-menu-overlay.on{opacity:1;pointer-events:all}
.prof-menu-sheet{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:24px;transform:translateY(40px);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.prof-menu-overlay.on .prof-menu-sheet{transform:translateY(0)}
.pm-handle{width:36px;height:4px;background:var(--border);border-radius:10px;margin:0 auto 20px}
.pm-user-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.pm-av{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;font-weight:700;flex-shrink:0}
.pm-name{font-size:16px;font-weight:700}
.pm-meta{font-size:12px;color:var(--muted);margin-top:2px}
.pm-actions{display:flex;flex-direction:column;gap:8px}
.pm-action{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text);background:none;border:1px solid var(--border);font-family:var(--font);width:100%;text-align:left;transition:all .2s}
.pm-action:hover{background:var(--card2);border-color:rgba(255,255,255,.15)}
.pm-action i{width:16px;color:var(--muted)}
.pm-action.danger{color:var(--red)}
.pm-action.danger i{color:var(--red)}
.pm-action.danger:hover{background:rgba(232,16,42,.07);border-color:rgba(232,16,42,.2)}

@media(max-width:900px){.sr{display:none}}
@media(max-width:640px){
  .sl,.feed-tabs,.search-wrap{display:none}
  .mobile-bottom-nav{display:flex}
  .app{padding-bottom:58px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .topnav{padding:0 12px}
  .tl-name{font-size:18px}
  .feed-main{overflow:visible}
  .feed-scroll{overflow:visible;padding:10px}
}
@media(min-width:641px){
  .app{overflow:hidden}
  .feed-scroll{overflow-y:auto}
}

  <!-- MAIN FEED -->

    <!-- SUBNAV -->

</div>

<!-- MOBILE BOTTOM NAV -->
<div class="mobile-bottom-nav">
  <button class="mbn-item on" id="mbn-home" onclick="setMenu('all',null);setMobileBottomActive('mbn-home')"><i class="fa-solid fa-house"></i>Home</button>
  <button class="mbn-item" id="mbn-saved" onclick="setMenu('bookmarks',null);setMobileBottomActive('mbn-saved')"><i class="fa-solid fa-bookmark"></i>Saved</button>

</div>

  <div class="prof-menu-sheet" id="prof-menu-content"></div>

<script>
// ── STATE ──────────────────────────────────────
let activeCat = null, activeSort = 'newest', activeMenu = 'all', searchTerm = '';
let currentPostId = null;
const BASE = 'https://tnsarmwrestling.com/wp-content/uploads/2023/07';

// ── LEVEL BADGE CLASSES ────────────────────────
const badgeCls = {pro:'pb-pro',elite:'pb-elite',coach:'pb-coach',beginner:'pb-beginner',amateur:'pb-amateur',admin:'pb-admin',tns:'pb-tns'};
const lvlCls = {pro:'lv-pro',elite:'lv-elite',coach:'lv-coach',beginner:'lv-beginner',amateur:'lv-amateur',admin:'lv-admin'};
const avCls = {pro:'uav-pro',elite:'uav-elite',coach:'uav-coach',admin:'uav-admin'};

// ── INIT ───────────────────────────────────────
function init(){
  const user = TNS_DB.getCurrentUser();
  buildNav(user);
  buildProfBox(user);
  buildCatList();
  buildLeaderboard();
  renderFeed();
  updateStats();
  setTimeout(()=>toast('Welcome to TNS Community 💪','s'),800);
}

// ── NAV BUILD ──────────────────────────────────
function buildNav(user){
  const el = document.getElementById('nav-right');
  if(user){
    const avc = avCls[user.level]||'uav-default';
    el.innerHTML = `
      <button class="create-btn" onclick="openCreate()"><i class="fa-solid fa-plus"></i> Post</button>
      <div class="icon-btn" onclick="toast('3 new notifications 🔔','i')">
        <i class="fa-solid fa-bell"></i><div class="notif-badge">3</div>
      </div>
      <div class="icon-btn" onclick="toast('Messages coming soon 💬','i')">
        <i class="fa-solid fa-comment-dots"></i>
      </div>
      <div class="user-pill" onclick="showProfileMenu()">
        <div class="uav ${avc}">${user.avatar}</div>
        <div>
          <div class="uname">${user.username}</div>
          <div class="ulv ${lvlCls[user.level]||''}">${user.level.toUpperCase()}</div>
        </div>
      </div>`;
  } else {
    el.innerHTML = `<a href="auth.html" class="create-btn"><i class="fa-solid fa-hand-fist"></i> Sign In</a>`;
  }
}

// ── PROFILE BOX ───────────────────────────────
function getAvatarHTML(user, size=48, radius=14){
  if(user && user.profilePic){
    return `<img src="${user.profilePic}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover">`;
  }
  return user ? (user.avatar || (user.name||'U').slice(0,2).toUpperCase()) : '?';
}

function buildProfBox(user){
  const el = document.getElementById('prof-box');
  if(!user){
    el.innerHTML = `<div style="text-align:center;padding:6px 0">
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px">Sign in to join the community</div>
      <a href="auth.html" class="lp-btn" style="display:inline-flex;justify-content:center"><i class="fa-solid fa-hand-fist"></i> Sign In / Join</a>
    </div>`;
    return;
  }
  const avc = avCls[user.level]||'uav-default';
  const xpPct = Math.min(100, Math.round(((user.xp||0)/10000)*100));
  el.innerHTML = `
    <div class="prof-top">
      <div class="prof-av ${avc}">${user.avatar}</div>
      <div>
        <div class="prof-name">${user.username}</div>
        <div class="prof-lv"><i class="fa-solid fa-crown" style="color:var(--gold);font-size:9px"></i><span class="ulv ${lvlCls[user.level]||''}" style="font-size:10px">${user.level.toUpperCase()}</span></div>
        <div class="prof-loc">${user.city||'Pune'} · ${user.weight||'—'}</div>
      </div>
    </div>
    <div class="prof-stats">
      <div class="ps"><div class="ps-n" style="color:var(--gold)">${(user.xp||0).toLocaleString()}</div><div class="ps-l">XP</div></div>
      <div class="ps"><div class="ps-n">${TNS_DB.getPosts({authorId:user.id}).length}</div><div class="ps-l">Posts</div></div>
    </div>
    <div class="xp-row"><span>Next Level</span><span>${user.xp||0} XP</span></div>
    <div class="xp-track"><div class="xp-fill" style="width:${xpPct}%"></div></div>`;
}

// ── CAT LIST ───────────────────────────────────
function buildCatList(){
  const cats = [
    {name:'All',icon:'fa-comments',val:null},
    {name:'Training',icon:'fa-dumbbell',val:'Training & Strength'},
    {name:'Technique',icon:'fa-hand-fist',val:'Technique'},
    {name:'Matches',icon:'fa-film',val:'Match Videos'},
    {name:'Events',icon:'fa-trophy',val:'Events'},
    {name:'Beginners',icon:'fa-star',val:'Beginner Questions'},
    {name:'Injury',icon:'fa-shield-halved',val:'Injury Prevention'},
    {name:'Equipment',icon:'fa-table',val:'Equipment'},
  ];
  document.getElementById('cat-list').innerHTML = cats.map((c,i)=>`
    <div class="sl-item${i===0?' on':''}" onclick="slCatClick(this,'${c.val||''}')">
      <i class="fa-solid ${c.icon}"></i> ${c.name}
    </div>`).join('');
}

// ── LEADERBOARD ────────────────────────────────
function buildLeaderboard(){
  const medals = ['👑','🥈','🥉','④','⑤'];
  document.getElementById('lb-list').innerHTML = TNS_DB.getLeaderboard(5).map((u,i)=>`
    <div class="lb-item">
      <div class="lb-rank">${i+1}</div>
      <div class="lb-row" onclick="toast('Viewing @${u.username}','i')">
        <span class="lb-medal">${medals[i]||''}</span>
        <span class="lb-name">${u.username}</span>
        <span class="lb-pts">${(u.xp||0).toLocaleString()}</span>
      </div>
    </div>`).join('');
}

// ── STATS ──────────────────────────────────────
function updateStats(){
  // Deterministic pseudo-online count based on hour (avoids flashing new number every render)
  const hour = new Date().getHours();
  const base = [120,90,70,55,50,60,110,210,340,420,510,560,530,490,470,510,540,580,550,500,430,370,290,200];
  const online = base[hour] + Math.floor(Math.sin(Date.now()/60000)*20);
  document.getElementById('online-stat').textContent = Math.max(40,online).toLocaleString();
  const today = Date.now()-86400000;
  document.getElementById('posts-stat').textContent = TNS_DB.getPosts().filter(p=>p.ts>today).length;
}

// ── FEED RENDER ────────────────────────────────
function getPosts(){
  if(activeMenu==='bookmarks') return TNS_DB.getBookmarkedPosts();
  if(activeMenu==='following') return TNS_DB.getFollowingPosts();
  const opts = {};
  if(activeCat) opts.category = activeCat;
  if(searchTerm) opts.search = searchTerm;
  const sortMap = {'votes':'top','newest':'new','hot':'hot','top':'top','new':'new'};
  opts.sort = sortMap[activeSort] || activeSort;  // hot/top/new
  return TNS_DB.getPosts(opts);
}

function renderFeed(){
  const posts = getPosts();
  const el = document.getElementById('feed');
  if(!posts.length){
    el.innerHTML = `<div class="empty-state"><div class="es-icon">💪</div><div class="es-title">No Posts Found</div><div class="es-sub">Try another filter or be the first to post!</div></div>`;
    return;
  }
  el.innerHTML = posts.map(p=>{
    const a = TNS_DB.getUser(p.authorId)||{username:'deleted',avatar:'??',level:'beginner'};
    const voted = TNS_DB.getVote('post',p.id);
    const bkm = TNS_DB.isBookmarked(p.id);
    const bc = badgeCls[a.level]||'pb-beginner';
    const ll = a.level.toUpperCase();
    return `
    <div class="pcard${p.pinned?' pinned':''}" onclick="openPost('${p.id}')">
      ${p.pinned?`<div class="pin-tag"><i class="fa-solid fa-thumbtack"></i> Pinned</div>`:''}
      <div class="pinner">
        <div class="vcol" onclick="event.stopPropagation()">
          <button class="vup${voted===1?' on':''}" onclick="doVote('${p.id}',1)"><i class="fa-solid fa-chevron-up"></i></button>
          <div class="vnum" id="vn-${p.id}">${p.votes}</div>
          <button class="vdown${voted===-1?' on':''}" onclick="doVote('${p.id}',-1)"><i class="fa-solid fa-chevron-down"></i></button>
        </div>
        <div class="pbody">
          <div class="pmeta">
            <div class="p-av">${a.avatar}</div>
            <span class="p-user" onclick="event.stopPropagation();toast('@${a.username}','i')">${a.username}</span>
            <span class="pbadge ${bc}">${ll}</span>
            <span class="p-time">${TNS_DB._timeAgo(p.ts)}</span>
            <span class="p-cat-tag">${p.category}</span>
          </div>
          <div class="ptitle">${p.title}</div>
          ${p.body?`<div class="ptext">${p.body}</div>`:''}
          ${p.image?`<div class="pimg" onclick="event.stopPropagation()"><img src="${p.image}" loading="lazy" onerror="this.parentElement.style.display='none'" alt=""></div>`:''}
          <div class="pactions" onclick="event.stopPropagation()">
            <button class="pa" onclick="openPost('${p.id}')"><i class="fa-solid fa-comment"></i> ${p.commentCount}</button>
            <button class="pa" onclick="sharePost('${p.id}')"><i class="fa-solid fa-share-nodes"></i> Share</button>
            <span class="pa-sep"></span>
            <button class="pa${bkm?' bkm':''}" id="bk-${p.id}" onclick="toggleBkm('${p.id}',this)"><i class="fa-${bkm?'solid':'regular'} fa-bookmark"></i></button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── VOTING ─────────────────────────────────────
function doVote(pid,dir){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to vote','e');return}
  TNS_DB.vote('post',pid,dir);
  const p = TNS_DB.getPost(pid);
  if(p){ const el=document.getElementById('vn-'+pid); if(el) el.textContent=p.votes; }
  renderFeed();
}

// ── BOOKMARKS ──────────────────────────────────
function toggleBkm(pid,el){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to bookmark','e');return}
  const added = TNS_DB.toggleBookmark(pid);
  el.className = 'pa'+(added?' bkm':'');
  el.innerHTML = `<i class="fa-${added?'solid':'regular'} fa-bookmark"></i>`;
  toast(added?'Saved! 🔖':'Removed','s');
}

function sharePost(pid){
  navigator.clipboard?.writeText(window.location.href+'#post-'+pid).catch(()=>{});
  toast('Link copied! 🔗','s');
}

// ── POST DETAIL ────────────────────────────────
function openPost(pid){
  const p = TNS_DB.getPost(pid);
  if(!p) return;
  currentPostId = pid;
  const a = TNS_DB.getUser(p.authorId)||{username:'deleted',avatar:'??',level:'beginner'};
  const comments = TNS_DB.getComments(pid);
  const voted = TNS_DB.getVote('post',pid);
  const bkm = TNS_DB.isBookmarked(pid);
  const user = TNS_DB.getCurrentUser();
  const bc = badgeCls[a.level]||'pb-beginner';

  const cmtHTML = comments.map(c=>{
    const ca = TNS_DB.getUser(c.authorId)||{username:'deleted',avatar:'??',level:'beginner'};
    return `<div class="comment">
      <div class="com-av">${ca.avatar}</div>
      <div class="com-body-wrap">
        <div class="com-meta-row">
          <span class="com-user">${ca.username}</span>
          <span class="pbadge ${badgeCls[ca.level]||'pb-beginner'}" style="font-size:8px;padding:1px 6px">${ca.level.toUpperCase()}</span>
          <span class="com-time">${TNS_DB._timeAgo(c.ts)}</span>
        </div>
        <div class="com-text">${c.body}</div>
        <div class="com-acts-row">
          <button class="ca" onclick="voteComment('${c.id}',this)"><i class="fa-solid fa-chevron-up"></i> ${c.votes}</button>
          <button class="ca">Reply</button>
        </div>
      </div>
    </div>`;
  }).join('');

  const loginPromptHTML = !user ? `<div class="login-prompt"><div class="lp-title">Join the conversation</div><div class="lp-sub">Sign in to comment, vote, and post.</div><a href="auth.html" class="lp-btn"><i class="fa-solid fa-hand-fist"></i> Sign In / Join</a></div>` : '';

  document.getElementById('post-modal-cat').textContent = p.category;
  document.getElementById('post-modal-body').innerHTML = `
    <div class="d-meta">
      <div class="p-av">${a.avatar}</div>
      <span class="p-user">${a.username}</span>
      <span class="pbadge ${bc}">${a.level.toUpperCase()}</span>
      <span class="p-time">${TNS_DB._timeAgo(p.ts)}</span>
    </div>
    <div class="d-title">${p.title}</div>
    ${p.body?`<div class="d-body">${p.body}</div>`:''}
    ${p.image?`<div class="d-img"><img src="${p.image}" onerror="this.parentElement.style.display='none'" alt=""></div>`:''}
    <div class="d-actions">
      <button class="da${voted===1?' voted':''}" onclick="detVote('${pid}',1)">
        <i class="fa-solid fa-chevron-up"></i> <span id="det-vn-${pid}">${p.votes}</span> Votes
      </button>
      <button class="da${bkm?' bkm':''}" id="det-bk-${pid}" onclick="detBkm('${pid}')">
        <i class="fa-${bkm?'solid':'regular'} fa-bookmark"></i> ${bkm?'Saved':'Save'}
      </button>
      <button class="da" onclick="sharePost('${pid}')"><i class="fa-solid fa-share-nodes"></i> Share</button>
    </div>
    <div class="com-title-row">${p.commentCount} Comment${p.commentCount!==1?'s':''}</div>
    ${user?`<div class="com-input-row"><textarea class="com-ta" id="com-inp" placeholder="Write a comment..." rows="1"></textarea><button class="com-send" onclick="submitComment('${pid}')">Send</button></div>`:''}
    ${loginPromptHTML}
    ${cmtHTML}`;

  document.getElementById('ov-post').classList.add('on');
  setTimeout(()=>{ const t=document.getElementById('com-inp'); if(t) t.focus(); },350);
}

function detVote(pid,dir){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to vote','e');return}
  TNS_DB.vote('post',pid,dir);
  const p = TNS_DB.getPost(pid);
  if(p){
    const el = document.getElementById('det-vn-'+pid);
    if(el) el.textContent = p.votes;
    const vn = document.getElementById('vn-'+pid);
    if(vn) vn.textContent = p.votes;
  }
}

function detBkm(pid){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to save','e');return}
  const added = TNS_DB.toggleBookmark(pid);
  const btn = document.getElementById('det-bk-'+pid);
  if(btn){ btn.className='da'+(added?' bkm':''); btn.innerHTML=`<i class="fa-${added?'solid':'regular'} fa-bookmark"></i> ${added?'Saved':'Save'}`; }
  const mainBtn = document.getElementById('bk-'+pid);
  if(mainBtn){ mainBtn.className='pa'+(added?' bkm':''); mainBtn.innerHTML=`<i class="fa-${added?'solid':'regular'} fa-bookmark"></i>`; }
  toast(added?'Saved! 🔖':'Removed','s');
}

function voteComment(id,btn){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to vote','e');return}
  const res = TNS_DB.vote('comment',id,1);
  if(res.ok) btn.innerHTML = `<i class="fa-solid fa-chevron-up"></i> ${res.votes}`;
}

function submitComment(pid){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to comment','e');return}
  const inp = document.getElementById('com-inp');
  if(!inp||!inp.value.trim()) return;
  const res = TNS_DB.addComment(pid, inp.value.trim());
  if(!res.ok){toast(res.error,'e');return}
  openPost(pid);
  renderFeed();
  buildProfBox(TNS_DB.getCurrentUser());
  toast('Comment posted! 🔥','s');
}

// ── CREATE POST ────────────────────────────────
function openCreate(){
  const user = TNS_DB.getCurrentUser();
  if(!user){toast('Sign in to post','e');window.location.href='auth.html';return}
  document.getElementById('cr-title').value='';
  document.getElementById('cr-body').value='';
  document.getElementById('cr-img').value='';
  document.getElementById('ov-create').classList.add('on');
  setTimeout(()=>document.getElementById('cr-title').focus(),300);
}

function submitPost(){
  const title = document.getElementById('cr-title').value.trim();
  const body = document.getElementById('cr-body').value.trim();
  const cat = document.getElementById('cr-cat').value;
  const img = document.getElementById('cr-img').value.trim();
  if(!title){toast('Please enter a title','e');return}
  const res = TNS_DB.createPost({title,body,category:cat,image:img||null});
  if(!res.ok){toast(res.error,'e');return}
  closeModal('ov-create');
  renderFeed();
  buildLeaderboard();
  buildProfBox(TNS_DB.getCurrentUser());
  updateStats();
  toast('Post published! 🚀','s');
}

// ── FILTERS ────────────────────────────────────
function setFeedTab(tab,el){
  document.querySelectorAll('.ftab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  if(tab==='hot') activeSort='hot';
  else if(tab==='top') activeSort='top';
  else activeSort='new';
  renderFeed();
}

function setCat(cat,el){
  activeCat = cat||null;
  if(el){ document.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
  else { document.querySelectorAll('.cat-tab').forEach(x=>x.classList.remove('on')); document.querySelector('.cat-tab').classList.add('on'); }
  renderFeed();
}

function slCatClick(el,catVal){
  document.querySelectorAll('.sl-item').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  activeCat = catVal||null;
  renderFeed();
}

function setSort(sort,el){
  document.querySelectorAll('.sort-btn').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  activeSort = sort; // 'hot','top','new'
  renderFeed();
}

function setMenu(type,el){
  if(el){ document.querySelectorAll('[id^="sl-"]').forEach(x=>x.classList.remove('on')); el.classList.add('on'); }
  activeMenu = type;
  activeCat = null;
  renderFeed();
}

function handleSearch(v){
  searchTerm = v;
  renderFeed();
}

// ── MODALS ─────────────────────────────────────
function closeModal(id){
  document.getElementById(id).classList.remove('on');
}

// ── PROFILE MENU ───────────────────────────────
function showProfileMenu(){
  const user = TNS_DB.getCurrentUser();
  if(!user){ window.location.href='auth.html'; return; }
  const avc = avCls[user.level]||'uav-default';
  const overlay = document.getElementById('prof-menu-overlay');
  document.getElementById('prof-menu-content').innerHTML = `
    <div class="pm-handle"></div>
    <div class="pm-user-row">
      <div class="pm-av ${avc}">${user.avatar}</div>
      <div>
        <div class="pm-name">${user.username}</div>
        <div class="pm-meta">${user.level.toUpperCase()} · ${(user.xp||0).toLocaleString()} XP · ${user.city||'Pune'}</div>
      </div>
    </div>
    <div class="pm-actions">
      <button class="pm-action" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-user"></i> View Profile
      </button>
      <button class="pm-action" onclick="window.location.href='profile.html?tab=edit'">
        <i class="fa-solid fa-gear"></i> Settings
      </button>
      <button class="pm-action danger" onclick="doLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Log Out
      </button>
    </div>`;
  overlay.classList.add('on');
}
function closeProfileMenu(){
  document.getElementById('prof-menu-overlay').classList.remove('on');
}
function doLogout(){
  TNS_DB.logout();
  window.location.href='auth.html';
}

// ── TOAST ──────────────────────────────────────
function toast(msg, type='s'){
  const t = document.getElementById('toast');
  const icons = {s:'fa-check-circle',e:'fa-times-circle',i:'fa-info-circle'};
  t.className = `show ${type}`;
  t.innerHTML = `<i class="fa-solid ${icons[type]||icons.s}"></i> ${msg}`;
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 2800);
}

// ── MODALS ─────────────────────────────────────
function closeModal(id){
  if(id==='ov-create'){
    const title = document.getElementById('cr-title')?.value.trim();
    const body = document.getElementById('cr-body')?.value.trim();
    if(title||body){
      if(!confirm('Discard this post? Your draft will be lost.')) return;
    }
  }
  document.getElementById(id).classList.remove('on');
}

// ── KEYBOARD ───────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('prof-menu-overlay')?.classList.contains('on')){
      closeProfileMenu(); return;
    }
    document.querySelectorAll('.overlay.on').forEach(x=>{
      if(x.id==='ov-create'){
        const t=document.getElementById('cr-title')?.value.trim();
        const b=document.getElementById('cr-body')?.value.trim();
        if(t||b){ if(!confirm('Discard this post?')) return; }
      }
      x.classList.remove('on');
    });
  }
});

// ── MOBILE BOTTOM NAV ACTIVE ───────────────────
function setMobileBottomActive(id){
  document.querySelectorAll('.mbn-item').forEach(x=>x.classList.remove('on'));
  document.getElementById(id)?.classList.add('on');
}

window.onload = init;
</script>
